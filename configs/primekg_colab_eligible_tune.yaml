# Colab T4 version of configs/primekg_eligible_tune.yaml (results on Google Drive).
base: primekg_colab_eligible.yaml
tune:
  models: [hgt, gated]
  settings: [disease]
  seeds: [0]
  max_trials: 4            # proposal 9.2: <= 4 configurations per model
  sample_seed: 0
  epochs: 60
  patience: 8
  grid:                    # 2 x 2 = exactly 4 configurations; dropout 0.2, heads 2 from the base config
    model.hidden: [64, 128]  # proposal 10.6: 128 only if supported -> tuning decides
    train.lr: [1.0e-3, 5.0e-4]
gates:
  setting: disease